name: Deploy to OVH

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Not secret: this ends up in the public JS bundle regardless.
          VITE_API_URL: https://api.foodtracker.alexis2d.fr

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: foodtracker/

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need the previous commit locally to diff composer.lock below.
          fetch-depth: 0

      # vendor/ is ~4500 files and is by far the slowest part of the FTP
      # upload (tens of minutes on OVH's shared-hosting FTP), but composer
      # output is fully deterministic for a given composer.lock — re-uploading
      # it when no dependency changed is pure waste. Skip that whole step
      # unless this push actually touched composer.lock.
      - name: Check whether composer.lock changed
        id: deps
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" -- backend/composer.lock | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, sodium, opcache
          tools: composer:v2

      # Written before `composer install` on purpose: composer's post-install
      # scripts boot the Symfony kernel, and without APP_ENV=prod already in
      # place they'd try to load dev-only bundles that --no-dev just removed.
      - name: Write production .env.local
        working-directory: backend
        run: |
          cat > .env.local <<EOF
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          JWT_TOKEN_TTL=604800
          CORS_ALLOW_ORIGIN=^https://foodtracker\.alexis2d\.fr$
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          MAILER_FROM=no-reply-foodtracker@alexis2d.fr
          FRONTEND_URL=https://foodtracker.alexis2d.fr
          EOF
          # Only written when the secret actually has a value. An empty
          # MAILER_DSN= line here would override (with an *invalid* DSN) the
          # safe null://null default from the committed backend/.env — that
          # invalid DSN breaks Mailer service construction outright, which
          # 500s every endpoint that depends on it (register, forgot/reset
          # password, etc.), not just the ones that actually send mail. Only
          # add this line once real SMTP credentials are in place.
          if [ -n "${{ secrets.MAILER_DSN }}" ]; then
            echo "MAILER_DSN=${{ secrets.MAILER_DSN }}" >> .env.local
          fi

      - name: Write JWT keypair
        working-directory: backend
        run: |
          mkdir -p config/jwt
          printf '%s\n' "${{ secrets.JWT_PRIVATE_KEY }}" > config/jwt/private.pem
          printf '%s\n' "${{ secrets.JWT_PUBLIC_KEY }}" > config/jwt/public.pem

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction

      # Own FTP target + own state file, so it's tracked independently from
      # the app-code deploy below and only ever runs when composer.lock
      # actually changed (see the "Check whether composer.lock changed" step).
      - name: Deploy vendor/ via FTP
        if: steps.deps.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/vendor/
          server-dir: foodtracker-api/vendor/

      # --classmap-authoritative (above) bakes every App\ class under src/ into
      # vendor/composer/autoload_classmap.php and forbids the autoloader from
      # falling back to a filesystem lookup for anything missing from that
      # map. That map depends on what's in src/, not on composer.lock — so
      # skipping this upload whenever a push only adds/renames PHP classes
      # (the common case) leaves the server's classmap stale and every request
      # touching a new class fatals with "Class ... not found". Unlike the
      # rest of vendor/, this directory is a handful of small generated PHP
      # files (not installed packages), so it's cheap enough to re-upload on
      # every deploy regardless of the composer.lock diff above.
      - name: Deploy vendor autoloader via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/vendor/composer/
          server-dir: foodtracker-api/vendor/composer/

      - name: Deploy app code via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: foodtracker-api/
          exclude: |
            **/.git*
            **/.git*/**
            **/var/**
            **/tests/**
            **/vendor/**

      # FTP upload only touches source files (var/ is excluded above), so the
      # compiled container + router cache from the previous deploy is still
      # what's being served. clear-cache.php is a plain script outside
      # Symfony's router (see that file for why), so it's reachable
      # regardless of how stale that cache is.
      - name: Clear remote cache
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST https://api.foodtracker.alexis2d.fr/clear-cache.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "Clear-cache endpoint returned HTTP $http_code"
            exit 1
          fi

      # The OVH shared MySQL database is only reachable from inside OVH's own
      # network, so this runner can't connect to it directly (see
      # DeployController). Instead, hit the just-deployed app over HTTPS and
      # let it run the migration itself. This is a fresh request/process
      # booting against the just-cleared cache, so it rebuilds cleanly —
      # unlike clearing and migrating in one request (see clear-cache.php).
      - name: Trigger remote migration
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST https://api.foodtracker.alexis2d.fr/api/internal/migrate \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "Migration endpoint returned HTTP $http_code"
            exit 1
          fi
