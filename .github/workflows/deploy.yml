name: Deploy to OVH

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Not secret: this ends up in the public JS bundle regardless.
          VITE_API_URL: https://api.foodtracker.alexis2d.fr

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: www/

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, sodium, opcache
          tools: composer:v2

      # Written before `composer install` on purpose: composer's post-install
      # scripts boot the Symfony kernel, and without APP_ENV=prod already in
      # place they'd try to load dev-only bundles that --no-dev just removed.
      - name: Write production .env.local
        working-directory: backend
        run: |
          cat > .env.local <<EOF
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          JWT_TOKEN_TTL=604800
          CORS_ALLOW_ORIGIN=^https://foodtracker\.alexis2d\.fr$
          EOF

      - name: Write JWT keypair
        working-directory: backend
        run: |
          mkdir -p config/jwt
          printf '%s\n' "${{ secrets.JWT_PRIVATE_KEY }}" > config/jwt/private.pem
          printf '%s\n' "${{ secrets.JWT_PUBLIC_KEY }}" > config/jwt/public.pem

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction

      - name: Run database migrations
        working-directory: backend
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: foodtracker-api/
          exclude: |
            **/.git*
            **/.git*/**
            **/var/**
            **/tests/**
