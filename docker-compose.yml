services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: foodtracker
      MYSQL_USER: foodtracker
      MYSQL_PASSWORD: foodtracker
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "foodtracker", "-pfoodtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build: ./docker/php
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    environment:
      DATABASE_URL: "mysql://foodtracker:foodtracker@mysql:3306/foodtracker?serverVersion=8.4.0&charset=utf8mb4"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-scripts && rm -rf var/cache/* && php -S 0.0.0.0:8000 -t public"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysqldata:
  backend_vendor:
  frontend_node_modules:
